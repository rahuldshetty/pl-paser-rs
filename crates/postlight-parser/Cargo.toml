[package]
name = "postlight-parser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[dependencies]
tokio.workspace = true
reqwest.workspace = true
futures.workspace = true

scraper.workspace = true
ego-tree.workspace = true
html5ever.workspace = true
url.workspace = true
regex.workspace = true
encoding_rs.workspace = true

chrono.workspace = true
chrono-tz.workspace = true
dateparser.workspace = true

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
once_cell.workspace = true

strsim.workspace = true
unicode-bidi.workspace = true

# Optional: `fallback` feature — readability-based content extraction
# used when the Mercury-style extractor produces no content
# (mirrors upstream's `fallback: true` option).
readability = { workspace = true, optional = true }

[features]
default = []
fallback = ["dep:readability"]

[dev-dependencies]
serde_json.workspace = true
