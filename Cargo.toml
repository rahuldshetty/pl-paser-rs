[workspace]
resolver = "2"
members = [
    "crates/postlight-parser",
    "crates/postlight-parser-cli",
]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/postlight/parser-rs"
description = "Extract meaningful content from the chaos of a web page — a Rust port of the Postlight Mercury Parser."

[workspace.dependencies]
# Async runtime + HTTP (Tauri uses tokio, so this stays compatible)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate", "cookies"] }
futures = "0.3"

# HTML parsing / querying / serialization
scraper = "0.27"
ego-tree = "0.11"
html5ever = "0.39"
url = "2"
regex = "1"
encoding_rs = "0.8"

# Dates
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dateparser = "0.3"

# Data / errors / misc
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
once_cell = "1"

# Text analysis (wuzzy/difflib replacements)
strsim = "0.11"

# Optional fallback content extractor (upstream `fallback: true` path)
# NOTE: upstream's `fallback` option means "fall back to the generic
# extractor", not readability; this readability-based last-resort content
# extraction is an optional extension gated behind the `fallback` cargo
# feature.
readability = { version = "0.3", default-features = false }

# CLI
clap = { version = "4", features = ["derive"] }
anyhow = "1"
